{id:"artikel",title:"Giống danh từ & mạo từ",de:"Genus und Artikel",topic:"der · die · das · ein · eine",rules:["Danh từ tiếng Đức có giống ngữ pháp: giống đực (der), giống cái (die), giống trung (das). Không suy ra giống chắc chắn từ nghĩa; học cả mạo từ cùng từ.","Mạo từ không xác định ở Nominativ: ein Kaffee, eine Suppe, ein Wasser. Danh từ tiếng Đức luôn viết hoa.","Tên đồ uống và món ăn cần học cùng mạo từ, ví dụ der Kaffee, der Tee, die Suppe, das Wasser."],examples:[["Der Kaffee ist heiß.","Cà phê nóng. der = giống đực."],["Die Suppe ist gut.","Món súp ngon. die = giống cái."],["Das Wasser ist kalt.","Nước lạnh. das = giống trung."]]},
{id:"akk",title:"Akkusativ – Tân ngữ trực tiếp",de:"Der Akkusativ",topic:"den · einen · die · das",rules:["Akkusativ thường chỉ đối tượng trực tiếp của hành động (gọi món, mua, uống). Hỏi Wen? hoặc Was?","Ở giống đực: der → den; ein → einen. Giống cái die/eine và giống trung das/ein không đổi dạng trong trường hợp này.","Mẫu: Ich möchte einen Kaffee. / Ich trinke einen Tee. / Ich bestelle eine Suppe."],examples:[["Ich möchte einen Kaffee.","Kaffee giống đực; ein → einen."],["Sie bestellt eine Suppe.","Suppe giống cái; eine giữ nguyên."],["Wir trinken das Wasser.","Wasser giống trung; das giữ nguyên."]]},
{id:"verb",title:"Chia động từ Präsens",de:"Präsens und Verbkonjugation",topic:"ich -e · du -st · er -t",rules:["Động từ thường ở hiện tại: ich -e; du -st; er/sie/es -t; wir -en; ihr -t; sie/Sie -en.","sein và haben bất quy tắc: ich bin / habe; du bist / hast; er ist / hat; wir sind / haben.","Với gốc kết thúc -t hoặc -d, thường chèn -e-: du arbeitest, er arbeitet."],examples:[["Ich lerne Deutsch.","lernen → ich lerne."],["Du trinkst Wasser.","trinken → du trinkst."],["Er arbeitet heute.","arbeiten → er arbeitet."]]},

{id:"neg",title:"Phủ định nicht / kein",de:"Negation",topic:"nicht · kein · keine · keinen",rules:["kein phủ định danh từ dùng với ein/eine hoặc không có mạo từ trong nhiều ngữ cảnh; kein biến cách giống ein.","nicht thường phủ định động từ, tính từ, trạng từ, hoặc thành phần xác định trong câu.","Akkusativ giống đực: keinen Kaffee. Giống cái: keine Suppe. Giống trung: kein Wasser."],examples:[["Ich trinke keinen Kaffee.","Phủ định một danh từ giống đực làm tân ngữ."],["Die Suppe ist nicht heiß.","Phủ định tính từ heiß."],["Ich habe keine Zeit.","Zeit giống cái; keine."]]},
{id:"polite",title:"Gọi món lịch sự",de:"Möchten und hätte gern",topic:"möchte · möchten · hätte gern",rules:["möchten (muốn, lịch sự) được chia: ich möchte, du möchtest, er möchte, wir möchten, ihr möchtet, sie/Sie möchten.","Mẫu gọi món: Ich möchte einen Tee, bitte. Sau möchte, danh từ chỉ món thường là tân ngữ Akkusativ.","Ich hätte gern ... = Tôi muốn ... (cách yêu cầu lịch sự). Vẫn chú ý biến cách Akkusativ của danh từ theo sau."],examples:[["Ich hätte gern einen Kaffee.","Tôi muốn một cà phê."],["Möchten Sie Wasser?","Ngài có muốn nước không?"],["Wir möchten zwei Suppen.","Chúng tôi muốn hai phần súp."]]},

let current="dashboard",lessonId="artikel",selected={},checked={},examMode=false,cardIndex=0,cardFlip=false;
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function dashboard(){const done=Object.keys(state.done).filter(k=>state.done[k]).length;const attempts=Object.values(state.results);const total=attempts.reduce((a,x)=>a+x.total,0);const right=attempts.reduce((a,x)=>a+x.right,0);return '<div class="hero"><div class="eyebrow" style="color:#9ce3c8">WILLKOMMEN ZURÜCK</div><h1>Học tiếng Đức có hệ thống.</h1><p class="muted">Mỗi ngày 30 phút: 10 phút lý thuyết · 10 phút bài tập · 5 phút flashcards · 5 phút ôn lỗi.</p><button class="btn" onclick="go(\'lessons\')">Bắt đầu buổi học →</button></div><div class="grid"><div class="card"><div class="muted tiny">BÀI NGỮ PHÁP</div><div class="stat">'+done+'/7</div><div class="bar"><div style="width:'+(done/7*100)+'%"></div></div></div><div class="card"><div class="muted tiny">ĐỘ CHÍNH XÁC</div><div class="stat">'+(total?Math.round(right/total*100):0)+'%</div><span class="muted tiny">'+total+' lượt câu hỏi đã làm</span></div><div class="card"><div class="muted tiny">CÂU CẦN ÔN</div><div class="stat">'+Object.keys(state.misses).length+'</div><span class="muted tiny">Hệ thống ghi lại câu từng trả lời sai</span></div></div><div class="card"><h2>Lộ trình học hiện tại</h2><p>Duolingo: <b>'+esc(state.currentUnit)+'</b></p><div class="info">Phát âm và nghe: luyện trên Duolingo. DeutschFlow: giải thích ngữ pháp, bài tập và luyện trí nhớ. Từ vựng được biên soạn theo chủ đề, không đồng bộ trực tiếp với Duolingo.</div><button class="btn alt" onclick="go(\'practice\')">Làm kiểm tra →</button></div>';}
function lessonList(){return headline("Grammar Academy","Chọn chuyên đề. Mỗi bài có quy tắc, ngoại lệ, ví dụ đối chiếu và bài tập.")+lessons.map((l,i)=>'<button class="topic" onclick="openLesson(\''+l.id+'\')"><div><div class="eyebrow">LEKTION '+(i+1)+'</div><h3 style="margin:7px 0 3px">'+esc(l.title)+'</h3><span class="muted tiny">'+esc(l.de)+' · '+esc(l.topic)+'</span></div><span class="pill">'+(state.done[l.id]?'✓ Đã học':'Mở bài →')+'</span></button>').join("");}
function genderTips(){return '<div class="card" style="border-color:#b9dbcb"><div class="eyebrow">MẸO GHI NHỚ · GENUS</div><h2>Mẹo nhớ der / die / das và các ngoại lệ</h2><p class="muted">Đừng học Kaffee riêng lẻ: luôn học <b>der Kaffee</b>, <b>die Kaffees</b>, và một câu mẫu. Hậu tố dưới đây là dấu hiệu nhận diện, không phải mọi chữ trùng ở cuối đều là hậu tố.</p><div class="grid"><div class="rule"><b>🔵 DER</b><p><b>-ling, -ismus</b>: der Frühling, der Tourismus. Ngày/tháng/mùa thường là der: der Montag, der Januar, der Winter.</p><p class="tiny">Đuôi -er chỉ là khuynh hướng: <b>das Wasser</b> và <b>die Butter</b> không phải der.</p></div><div class="rule"><b>🔴 DIE</b><p><b>-ung, -heit, -keit, -schaft, -ion, -tät, -ei, -in</b> (người nữ): die Rechnung, die Gesundheit, die Möglichkeit, die Bäckerei.</p><p class="tiny">Nhiều danh từ kết thúc -e là die như die Suppe, nhưng có <b>der Name, der Käse, das Auge</b>.</p></div><div class="rule"><b>🟡 DAS</b><p><b>-chen, -lein</b>: das Brötchen, das Mädchen. <b>-ment, -um</b> thường là das: das Dokument, das Museum.</p><p class="tiny">Ngoại lệ cần nhớ: <b>der Moment, der Irrtum</b>.</p></div></div><h3>Mẹo cực hữu ích: danh từ ghép nhìn từ phải sang trái</h3><p><b>der</b> Saft → <b>der</b> Apfelsaft; <b>die</b> Flasche → <b>die</b> Wasserflasche; <b>das</b> Ei → <b>das</b> Frühstücksei. Mạo từ phụ thuộc vào <b>thành tố cuối</b>.</p><h3>Mẹo nhớ theo câu thay vì học từng từ</h3><div class="example"><b>der Kaffee</b> → Ich möchte <b>einen Kaffee</b>. (Akkusativ giống đực)</div><div class="example"><b>die Suppe</b> → Ich bestelle <b>eine Suppe</b>. (Giống cái không đổi trong Akkusativ)</div><div class="example"><b>das Brötchen</b> → Ich esse <b>ein Brötchen</b>. (-chen là giống trung)</div><p>Gợi ý mã màu tự chọn: <span style="color:#296ec1"><b>der = xanh</b></span>, <span style="color:#bd4050"><b>die = đỏ</b></span>, <span style="color:#98730a"><b>das = vàng</b></span>. Đây chỉ là kỹ thuật ghi nhớ, không phải quy tắc ngữ pháp.</p><div class="info"><b>Phân biệt giống và cách:</b> der Kaffee (Nominativ) và einen Kaffee (Akkusativ) vẫn là cùng danh từ giống đực.<br><b>Không phải lúc nào đồ uống cũng cần mạo từ:</b> Ich trinke Kaffee/Wasser (nói chung). Ich möchte einen Kaffee thường là gọi một phần cà phê.</div><p class="muted tiny">Tham khảo: <a href="https://sites.lsa.umich.edu/german-resources/grammatik/gender/" target="_blank" rel="noopener noreferrer">University of Michigan</a> · <a href="https://wlc.camden.rutgers.edu/german/german-help/help-with-gender/" target="_blank" rel="noopener noreferrer">Rutgers University</a> · <a href="https://www.coerll.utexas.edu/gg/pdf/no_02.pdf" target="_blank" rel="noopener noreferrer">University of Texas</a> · <a href="https://www.hueber.de/media/36/Lagune_Grammatik_V01.pdf" target="_blank" rel="noopener noreferrer">Hueber Verlag</a></p><button class="btn" onclick="startQuiz(\'artikel\')">Luyện mẹo ghi nhớ →</button></div>';}
function openLesson(id){lessonId=id;current="lessons";const l=lessons.find(x=>x.id===id);nav();el("view").innerHTML='<button class="btn ghost" onclick="render()">← Danh sách bài</button>'+headline(l.title,l.de+' · '+l.topic)+'<div class="card"><h2>Nguyên tắc & phân tích</h2>'+l.rules.map((r,i)=>'<div class="rule"><b>Quy tắc '+(i+1)+'</b><br>'+esc(r)+'</div>').join('')+'<h2 style="margin-top:22px">Ví dụ có giải thích</h2>'+l.examples.map(a=>'<div class="example"><b>'+esc(a[0])+'</b><p class="muted" style="margin:6px 0 0">'+esc(a[1])+'</p></div>').join('')+(id==='artikel'?genderTips():'')+'<h2 style="margin-top:22px">Ghi chú của bạn</h2><textarea id="note" rows="3" placeholder="Viết lại quy tắc theo cách bạn hiểu...">'+esc(state.notes[id]||"")+'</textarea><div class="row" style="margin-top:13px"><button class="btn alt" onclick="saveNote()">Lưu ghi chú</button><button class="btn" onclick="completeLesson()">✓ Đánh dấu đã học</button><button class="btn ghost" onclick="startQuiz(\''+id+'\')">Luyện bài này →</button></div></div>';}
function saveNote(){state.notes[lessonId]=el("note").value;save();alert("Đã lưu ghi chú trên thiết bị này.");}
function completeLesson(){state.notes[lessonId]=el("note").value;state.done[lessonId]=true;markDaily();render();openLesson(lessonId);}
function practice(){return headline("Bài tập & kiểm tra","Chọn 1 chuyên đề hoặc đề tổng hợp 36 câu. Đáp án có giải thích bằng tiếng Việt.")+'<div class="card"><div class="row"><button class="btn '+(examMode?'':'alt')+'" onclick="startQuiz(\'all\')">Đề tổng hợp (36 câu)</button>'+lessons.map(l=>'<button class="btn ghost" onclick="startQuiz(\''+l.id+'\')">'+esc(l.title)+'</button>').join('')+'</div></div><div id="quiz"></div>';}
let quizTopic="all";
function startQuiz(topic){quizTopic=topic;current="practice";selected={};checked={};examMode=topic==="all";render(); }
function questions(){return raw.map((r,i)=>({i,topic:r[0],q:r[1],o:r[2],a:r[3],ex:r[4]})).filter(x=>quizTopic==="all"||x.topic===quizTopic);}
function renderQuestions(){const q=questions();el("quiz").innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">'+(quizTopic==="all"?"Bài kiểm tra tổng hợp":lessons.find(l=>l.id===quizTopic).title)+'</h2><span class="pill">'+Object.keys(selected).length+'/'+q.length+' đã làm</span></div>'+q.map((x,j)=>'<div style="padding:17px 0;border-bottom:1px solid #e6eee8"><b>'+(j+1)+'. '+esc(x.q)+'</b>'+x.o.map((o,k)=>'<button class="opt '+(selected[x.i]===k?'selected ':'')+(checked[x.i]!==undefined?(k===x.a?'correct':selected[x.i]===k?'wrong':''):'')+'" onclick="choose('+x.i+','+k+')" '+(checked[x.i]!==undefined?'disabled':'')+'>'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>').join('')+(checked[x.i]!==undefined?'<div class="info"><b style="color:'+(checked[x.i]?'#187854':'#b54b3b')+'">'+(checked[x.i]?'Chính xác':'Chưa đúng')+'</b><br>'+esc(x.ex)+'</div>':'')+'</div>').join('')+'<div class="row" style="margin-top:20px"><button class="btn" onclick="submitQuiz()" '+(Object.keys(selected).length<q.length?'disabled':'')+'>Chấm bài & lưu kết quả</button><button class="btn ghost" onclick="startQuiz(\''+quizTopic+'\')">Làm lại</button></div><div id="score"></div></div>';}
function choose(i,k){selected[i]=k;renderQuestions();}
function submitQuiz(){const qs=questions();if(qs.some(q=>selected[q.i]===undefined))return;let right=0;for(const q of qs){const ok=selected[q.i]===q.a;checked[q.i]=ok;if(ok){right++;delete state.misses[q.i];}else{state.misses[q.i]=(state.misses[q.i]||0)+1;}}const id=Date.now();state.results[id]={right,total:qs.length,topic:quizTopic,at:new Date().toISOString()};markDaily();renderQuestions();el("score").innerHTML='<div class="info"><h2>'+right+'/'+qs.length+' câu đúng · '+Math.round(right/qs.length*100)+'%</h2><p>'+(right/qs.length>=.8?"Đạt. Bạn có thể học bài tiếp theo.":"Hãy ôn các câu sai trong Sổ lỗi.")+'</p></div>'; }
function mistakes(){const ids=Object.keys(state.misses).map(Number);return headline("Sổ lỗi sai","Các câu đã sai được lưu trên thiết bị này để bạn ôn lại.")+(ids.length?'<div class="card">'+ids.map(i=>'<div class="example"><b>'+esc(raw[i][1])+'</b><div class="muted tiny">Đáp án: '+esc(raw[i][2][raw[i][3]])+' · '+esc(raw[i][4])+'</div></div>').join('')+'<button class="btn" onclick="startMistakeQuiz()">Luyện lại '+ids.length+' câu →</button></div>':'<div class="card">Chưa có lỗi sai. Hãy thử bài kiểm tra đầu tiên.</div>');}
function startMistakeQuiz(){const ids=Object.keys(state.misses).map(Number);if(!ids.length)return;quizTopic="all";current="practice";selected={};checked={};render();el("quiz").scrollIntoView();}
function vocabView(){const v=vocab[cardIndex];return headline("Từ vựng Duolingo Companion","30 từ/cụm chủ đề gọi món. Bấm thẻ để xem nghĩa; tự đánh dấu từ chưa thuộc.")+'<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">'+(cardIndex+1)+'/'+vocab.length+'</span><span class="muted tiny">'+Object.keys(state.vocab).length+' từ đánh dấu cần ôn</span></div><div class="flash" onclick="cardFlip=!cardFlip;render()" style="margin:16px 0"><div><strong>'+esc(cardFlip?v[1]:v[0])+'</strong><p style="color:#badbd0">Nhấn để lật thẻ</p></div></div><div class="row"><button class="btn ghost" onclick="shiftCard(-1)">← Trước</button><button class="btn alt" onclick="markCard()">'+(state.vocab[cardIndex]?'✓ Cần ôn lại':'Đánh dấu cần ôn')+'</button><button class="btn" onclick="shiftCard(1)">Tiếp →</button></div></div><div class="info">Lưu ý: đây là bộ từ theo chủ đề tương ứng, không phải danh sách chính thức hoặc dữ liệu đồng bộ từ tài khoản Duolingo.</div>';}
function shiftCard(d){cardIndex=(cardIndex+d+vocab.length)%vocab.length;cardFlip=false;render();}
function markCard(){if(state.vocab[cardIndex])delete state.vocab[cardIndex];else state.vocab[cardIndex]={markedAt:new Date().toISOString()};save();render();}
function settings(){return headline("Cài đặt & dữ liệu","MVP dùng localStorage. Để đồng bộ đa thiết bị cần triển khai Supabase/Auth trong phiên bản tiếp theo.")+'<div class="card"><h2>Tiến độ Duolingo</h2><p class="muted">Cập nhật Unit thủ công để tham chiếu nội dung.</p><input id="unit" value="'+esc(state.currentUnit)+'"><div class="row" style="margin-top:12px"><button class="btn" onclick="saveUnit()">Lưu Unit</button></div></div><div class="card"><h2>Sao lưu dữ liệu</h2><p class="muted">Xuất JSON để chuyển thiết bị hoặc khôi phục kết quả học; nhập sẽ thay thế dữ liệu hiện tại.</p><div class="row"><button class="btn" onclick="exportData()">Xuất JSON</button><label class="btn alt" style="cursor:pointer">Nhập JSON <input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div></div><div class="info"><b>Trạng thái đồng bộ:</b> Chưa bật Cloud Sync. GitHub Pages chỉ xuất bản mã nguồn, không lưu lịch sử học chung giữa các thiết bị. Không nhập khóa bí mật Supabase vào website công khai.</div>';}
function saveUnit(){state.currentUnit=el("unit").value.trim()||"Section 2 · Unit 6";save();render();}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="deutschflow-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importData(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(!obj||typeof obj!=="object"||!confirm("Thay dữ liệu hiện tại bằng bản sao lưu?"))return;state=Object.assign({},defaults,obj);save();render();alert("Đã nhập dữ liệu.");}catch(e){alert("Tệp JSON không hợp lệ.");}};r.readAsText(f);}
render();
</script></body></html>
